version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

    ignore:
      # chalk 5+ is ESM-only; scripts use require('chalk')
      - dependency-name: "chalk"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 needs a manual migration (new CLI/PostCSS plugin, CSS-first config)
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
